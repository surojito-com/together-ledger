services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: together_ledger
      POSTGRES_USER: together
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U together -d together_ledger"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - together-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4174:4174"

volumes:
  together-postgres:
