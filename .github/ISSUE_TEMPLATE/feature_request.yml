name: Feature request
description: Propose a privacy-conscious product improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What shared-travel problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and relationship-safety considerations
    validations:
      required: true
