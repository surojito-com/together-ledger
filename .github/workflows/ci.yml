name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck -w apps/mobile
      - run: npm run lint -w apps/mobile

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The browser suite is one of the two gates CLAUDE.md requires, and until now nothing but a
      # laptop ran it (#315). The committed images were recorded on that machine and render 26 to 30
      # pixels taller on Linux (#295), so a size mismatch would fail here for a reason that is not a
      # regression. Comparison is skipped rather than the images re-recorded, which would replace a
      # reviewed baseline with whatever a runner happens to draw. Everything else the suite asserts
      # still runs: containment at every viewport, the colour-token contracts, and the axe passes.
      - run: npx playwright test --ignore-snapshots
