name: Attribution

# Fails a PR, or a push to main, whose commits, title or body carry AI-tool or vendor
# attribution. See scripts/check-attribution.mjs and CLAUDE.md, "Branch naming and attribution".

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The session tooling appends a footer to every PR body it writes. Removing it with this
      # workflow's token sticks, where an edit through that tooling would only put it back.
      - if: github.event_name == 'pull_request'
        run: node scripts/check-attribution.mjs --strip-pr-body
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/check-attribution.mjs
