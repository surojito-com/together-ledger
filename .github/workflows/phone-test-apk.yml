name: Phone test APK

# Builds an Android APK of the phone app that installs straight onto a phone, so the app can be
# seen on a real device without waiting in the EAS free-tier queue or holding Expo credentials.
# GitHub's Ubuntu runners carry the Android SDK, so `expo prebuild` and Gradle do the whole build
# here. Run it from Actions → Phone test APK → Run workflow, then download the artifact on the
# phone, unzip it, and open the APK.
#
# This is a test build and nothing else:
# - It is signed with the debug key Expo's template ships, which is public. It must never be
#   uploaded to Play; store builds come from EAS (`eas build`), signed with the app's own key.
# - Android refuses to install one over the other, because the signatures differ. Uninstall this
#   build before installing an EAS one, and the reverse.
# - Its signing fingerprint is not the one #180's app links need. That comes from EAS.
# - It is built for arm64-v8a only, which every current Android phone runs, to keep the build short.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/phone-test-apk.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The same origin eas.json gives the preview and production builds.
      EXPO_PUBLIC_API_ORIGIN: https://api.together-ledger.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      # The generated manifest is not the whole story: libraries merge their own permissions in at
      # build time. This reads them from the built APK and fails if it asks for more than the
      # network (#258). The DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION androidx.core adds is the
      # app's own signature permission, which nothing outside the app can hold.
      - name: Check the APK asks only for the network
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt2" dump permissions apps/mobile/android/app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          { echo '### Permissions in the APK'; echo '```'; cat permissions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          unexpected="$(grep -oP "uses-permission: name='\K[^']+" permissions.txt | grep -vxF -e android.permission.INTERNET -e com.togetherledger.ledger.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::The APK asks for permissions apps/mobile/app.json does not grant: $unexpected"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: together-ledger-phone-test-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
