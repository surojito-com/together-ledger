services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${TOGETHER_ENV_FILE:?Set TOGETHER_ENV_FILE to a root-owned production environment file}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - together-postgres:/var/lib/postgresql/data

  app:
    image: ${TOGETHER_IMAGE:?Set TOGETHER_IMAGE to the reviewed container image or digest}
    restart: unless-stopped
    env_file:
      - ${TOGETHER_ENV_FILE:?Set TOGETHER_ENV_FILE to a root-owned production environment file}
    environment:
      HOST: 0.0.0.0
      PORT: 4174
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4174/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - ${TOGETHER_ENV_FILE:?Set TOGETHER_ENV_FILE to a root-owned production environment file}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - together-caddy-data:/data
      - together-caddy-config:/config

volumes:
  together-postgres:
  together-caddy-data:
  together-caddy-config:
